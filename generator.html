 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas Era - Clean Generator (No ID)</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#111;--muted:#9a958e;--line:#ece8e3}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--ink)}
.top{text-align:center;padding:18px 12px 6px}
.wrap{max-width:1150px;margin:0 auto;padding:12px;display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.04);display:flex;flex-direction:column;max-height:92vh}
h2{margin:0 0 4px;font-size:16px} .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
label{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:10px;display:block}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:5px;font-size:14px;background:#fffdfb}
textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:5px;font-size:14px;background:#fffdfb;resize:none;overflow:auto}
#desc{height:90px} #prompt{height:140px}
.row{display:flex;gap:8px}
.btn{padding:11px;border:none;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 10px;font-size:12px;width:auto}
.tag{display:inline-block;background:#111;color:#fff;border-radius:20px;padding:4px 10px;font-size:11px;margin:4px 4px 0 0}
pre{background:#0e0e0e;color:#e8e8e8;border-radius:12px;padding:12px;font-size:12px;line-height:1.5;overflow:auto;flex:1;min-height:300px;max-height:60vh;white-space:pre-wrap;word-break:break-word}
.hint{background:#fff6d6;border:1px dashed #e6c86a;border-radius:10px;padding:10px;font-size:12px;margin-top:10px;line-height:1.6}
.scroll{overflow:auto;flex:1;padding-right:4px}
</style>
</head>
<body>
<div class="top"><h1 style="margin:0;font-size:20px">Canvas Era — Clean Generator</h1><p class="sub">بدون ID وبدون أرقام - الصق الجديد بأول المصفوفة</p></div>
<div class="wrap">
<div class="card"><div class="scroll">
<h2>1. المعلومات</h2>
<label>Title *</label><input id="title" placeholder="Rainy Day Serenity: A Childhood Memory">
<label>Slug (auto)</label><input id="slug">
<label>Description</label><textarea id="desc" placeholder="Embrace the comfort..."></textarea>
<label>Prompt --ar 2:3 etc</label><textarea id="prompt" placeholder="A charming illustration... --ar 2:3"></textarea>
<div class="row"><div style="flex:1"><label>Category</label><select id="cat"><option>Art</option><option>Culture</option><option>Anime</option><option>History</option><option>Portrait</option><option>Illustration</option></select></div><div style="flex:1"><label>Date</label><input id="date" type="date"></div></div>
<label>Tags (comma)</label><input id="tags" placeholder="Umbrella, Rainy, Cozy"><div id="tagsPrev"></div>
<label>Ext</label><select id="ext"><option value="jpg">.jpg</option><option value="png">.png</option><option value="webp">.webp</option></select>
<label>Image name</label><input id="img">
<div class="hint">📌 <b>الطريقة الصحيحة:</b><br>1. ارفع الصورة لمجلد <code>images/</code> بنفس الاسم<br>2. افتح <code>posts.js</code><br>3. الصق الكود <b>بأول المصفوفة</b> مباشرة بعد <code>const posts = [</code><br>4. اترك <code>];</code> بالاخير</div>
</div></div>
<div class="card">
<h2>2. الكود - بدون ID</h2>
<div class="row"><button class="btn small ghost" onclick="cp(false)">Copy Object</button><button class="btn small ghost" onclick="cp(true)">Copy with Comma</button><button class="btn small ghost" onclick="copyImg()">Copy Image</button></div>
<pre id="code"></pre>
<div class="row"><button class="btn" onclick="cp(false)">نسخ الكود</button><button class="btn ghost" onclick="cp(true)">نسخ مع فاصلة</button></div>
<div id="sug" style="margin-top:8px"></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
$('date').valueAsDate=new Date();
function slugify(s){return s.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,60)}
function gen(){
 let t=$('title').value||'untitled'; let sl=slugify(t);
 if(!$('slug').dataset.m) $('slug').value=sl;
 let s=$('slug').value||sl; let ext=$('ext').value;
 if(!$('img').dataset.m) $('img').value=s+'.'+ext;
 let tags=$('tags').value.split(',').map(x=>x.trim()).filter(Boolean);
 $('tagsPrev').innerHTML=tags.map(x=>`<span class=tag>${x}</span>`).join('');
 let d=$('date').value||new Date().toISOString().slice(0,10);
 let obj=`  {\n    "title": "${$('title').value.replace(/"/g,'\\"')}",\n    "slug": "${s}",\n    "desc": "${$('desc').value.replace(/"/g,'\\"')}",\n    "description": "${$('desc').value.replace(/"/g,'\\"')}",\n    "prompt": "${$('prompt').value.replace(/"/g,'\\"')}",\n    "image": "images/${$('img').value}",\n    "tags": [${tags.map(t=>`"${t}"`).join(', ')}],\n    "category": "${$('cat').value}",\n    "author": "Canvas Era",\n    "date": "${d}"\n  }`;
 $('code').textContent=obj;
 $('sug').innerHTML=`<span class=tag>${s}.${ext}</span>`;
}
['title','slug','desc','prompt','cat','tags','ext','img','date'].forEach(id=>{
 $(id).addEventListener('input',()=>{if(id==='slug'||id==='img')$(id).dataset.m=1; gen()})
});
$('ext').addEventListener('change',gen);
setInterval(gen,400);
function cp(withComma){let c=$('code').textContent; if(withComma) c='  ,\n'+c; navigator.clipboard.writeText(c); alert(withComma?'تم النسخ مع الفاصلة - الصقه بالبداية':'تم النسخ!')}
function copyImg(){navigator.clipboard.writeText($('img').value); alert($('img').value)}
gen();
</script>
</body>
</html>
