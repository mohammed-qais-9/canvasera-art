<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixed</title>
<style>body{font-family:system-ui;background:#f5f5f0;padding:12px}.card{background:#fff;padding:16px;border-radius:12px;max-width:700px;margin:0 auto 12px}input,textarea,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0 10px}button{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:8px;margin-top:6px;font-weight:700}button.g{ background:#16a34a}#log{background:#111;color:#0f0;padding:8px;border-radius:6px;font-size:11px;white-space:pre-wrap}</style>
</head><body>
<div class="card"><h3>Settings - canvasera-art</h3>
<input id="u" placeholder="username" value="mohammed-qais-9"><input id="r" value="canvasera-art"><input id="t" type="password" placeholder="ghp_ token"><input id="f" value="images">
<button onclick="localStorage.setItem('ce_u',u.value);localStorage.setItem('ce_r',r.value);localStorage.setItem('ce_t',t.value);localStorage.setItem('ce_f',f.value);log('Saved')">Save</button>
<button class="g" onclick="test()">Test Connection</button><div id="log">Ready</div></div>
<div class="card"><h3>New Post - SAFE Append Only</h3>
<input id="title" placeholder="Title"><input id="slug" placeholder="slug auto"><textarea id="desc" placeholder="Desc"></textarea><textarea id="prompt" placeholder="Prompt --ar 2:3"></textarea><select id="cat"><option>Culture</option><option>Art</option><option>Anime</option></select><input id="tags" placeholder="tags, comma"><input id="file" type="file" accept="image/*"><button class="g" onclick="pub()">Publish SAFE (no delete)</button></div>
<script>
function log(m){document.getElementById('log').textContent+='\n'+m}
u.value=localStorage.getItem('ce_u')||'mohammed-qais-9';r.value=localStorage.getItem('ce_r')||'canvasera-art';t.value=localStorage.getItem('ce_t')||'';f.value=localStorage.getItem('ce_f')||'images';
title.oninput=()=>slug.value=title.value.toLowerCase().replace(/[^a-z0-9]+/g,'-');
async function gh(p,me='GET',bd){let url=`https://api.github.com/repos/${(localStorage.getItem('ce_u')||u.value)}/${(localStorage.getItem('ce_r')||r.value)}/contents/${p}`;let res=await fetch(url,{method:me,headers:{Authorization:`token ${localStorage.getItem('ce_t')||t.value}`},body:bd?JSON.stringify(bd):null});let j=await res.json();if(!res.ok)throw new Error(j.message);return j}
async function test(){try{log('Testing...');let d=await gh('posts.js');log('✅ Connected '+d.sha.slice(0,7))}catch(e){log('❌ '+e.message)}}
function toB64(f){return new Promise((a,b)=>{let r=new FileReader();r.onload=()=>a(r.result.split(',')[1]);r.onerror=b;r.readAsDataURL(f)})}
async function pub(){try{let fi=file.files[0];if(!fi)return alert('اختار صورة');let safe=fi.name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9.\-]/g,'');log('Upload '+safe);let b64=await toB64(fi);let folder=localStorage.getItem('ce_f')||'images';try{await gh(`${folder}/${safe}`,'PUT',{message:'Add '+safe,content:b64})}catch(e){let cur=await gh(`${folder}/${safe}`);await gh(`${folder}/${safe}`,'PUT',{message:'Update '+safe,content:b64,sha:cur.sha})}log('✅ image');let posts=[];let sha='';try{let cur=await gh('posts.js');sha=cur.sha;let txt=atob(cur.content.replace(/\n/g,''));let m=txt.match(/const posts = ([\s\S]*?\]);/);if(m)posts=eval('('+m[1]+')')}catch(e){}let nid=posts.length?Math.max(...posts.map(x=>x.id))+1:1;let np={id:nid,title:title.value,slug:slug.value||title.value.toLowerCase().replace(/[^a-z0-9]+/g,'-'),desc:desc.value,description:desc.value,prompt:prompt.value,image:`${folder}/${safe}`,tags:tags.value.split(',').map(s=>s.trim()).filter(Boolean),category:cat.value,author:'Canvas Era',date:new Date().toISOString().slice(0,10)};posts.push(np);let content='const posts = '+JSON.stringify(posts,null,2)+';\n';let nb64=btoa(unescape(encodeURIComponent(content)));await gh('posts.js','PUT',{message:'Add '+np.slug,content:nb64,sha:sha||undefined});log('✅ Published ID '+nid);alert('تم بنجاح - المقالات القديمة بقت')}catch(e){log('❌ '+e.message);alert(e.message)}}
</script></body></html>
